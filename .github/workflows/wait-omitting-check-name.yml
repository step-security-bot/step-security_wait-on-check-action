name: Wait omitting check-name
on:
  workflow_dispatch:
  push:

jobs:
  wait-omitting-check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait on tests
        uses: ./
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10 # seconds
          running-workflow-name: wait-omitting-check-name
          # Harden-Runner completes only after all checks finish, so waiting on it would deadlock
          ignore-checks: StepSecurity Harden-Runner

      - name: Success
        run: echo 'success!'

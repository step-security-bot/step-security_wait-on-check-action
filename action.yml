name: "Wait on check"
author: 'step-security'
description: "Pause until a job in another workflow completes successfully."
inputs:
  allowed-conclusions:
    description: "Comma-separated list of acceptable conclusions"
    required: false
    default: success,skipped
  ignore-checks:
    description: "Comma-separated list of checks to ignore"
    required: false
    default: ""
  check-name:
    description: "Specific check name to wait for"
    required: false
    default: ""
  check-regexp:
    description: "Filter checks using regex pattern"
    required: false
    default: ""
  ref:
    description: "Git ref to check (branch/tag/commit SHA)"
    required: true
  repo-token:
    description: "GitHub token for API access"
    required: true
  wait-interval:
    description: "Seconds between API requests"
    required: false
    default: "10"
  api-endpoint:
    description: "Custom GitHub API endpoint (for GHE)"
    required: false
    default: ""
  running-workflow-name:
    description: "Name of current workflow (to exclude from waiting)"
    required: false
    default: ""
  verbose:
    description: "Print detailed logs"
    required: false
    default: true
  fail-on-no-checks:
    description: "Fail the action if no checks match the check-name or check-regexp filters"
    required: false
    default: true
  checks-discovery-timeout:
    description: "Seconds to wait for checks to be discovered"
    required: false
    default: "60"
  wait-for-duplicates:
    description: "Require every check with a duplicate name to succeed"
    required: false
    default: "false"
  bundler-cache:
    description: "Enable Bundler cache in ruby/setup-ruby"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="lewagon/wait-on-check-action"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash

    - name: Set the ruby version
      uses: step-security/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: ${{ inputs.bundler-cache }}
        working-directory: ${{ github.action_path }}
      env:
        BUNDLE_PATH: "${{ github.action_path }}/vendor/bundle"

    - name: Install dependencies without caching
      if: inputs.bundler-cache == 'false'
      run: bundle install
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        BUNDLE_PATH: "${{ github.action_path }}/vendor/bundle"

    - run: bundle exec entrypoint.rb
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        ALLOWED_CONCLUSIONS: ${{ inputs.allowed-conclusions }}
        IGNORE_CHECKS: ${{ inputs.ignore-checks }}
        CHECK_NAME: ${{ inputs.check-name }}
        CHECK_REGEXP: ${{ inputs.check-regexp }}
        REF: ${{ inputs.ref }}
        REPO_TOKEN: ${{ inputs.repo-token }}
        VERBOSE: ${{ inputs.verbose }}
        WAIT_INTERVAL: ${{ inputs.wait-interval }}
        RUNNING_WORKFLOW_NAME: ${{ inputs.running-workflow-name }}
        API_ENDPOINT: ${{ inputs.api-endpoint }}
        FAIL_ON_NO_CHECKS: ${{ inputs.fail-on-no-checks }}
        CHECKS_DISCOVERY_TIMEOUT: ${{ inputs.checks-discovery-timeout }}
        WAIT_FOR_DUPLICATES: ${{ inputs.wait-for-duplicates }}
        BUNDLE_PATH: "${{ github.action_path }}/vendor/bundle"

branding:
  icon: "check-circle"
  color: "green"
